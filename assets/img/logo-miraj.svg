<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="100%" height="100%">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E7A13C"/>
      <stop offset="45%" stop-color="#C6913A"/>
      <stop offset="100%" stop-color="#7B8894"/>
    </linearGradient>
  </defs>

  <!-- M Stylisé -->
  <g id="logo-mark">
    <!-- Jambe gauche & V -->
    <path d="M 72 292 L 72 100 L 176 226 L 280 100 L 280 292"
          fill="none" stroke="url(#mGrad)" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round" />
    <!-- Prolongement jambe droite flèche montante -->
    <path d="M 280 110 L 280 72"
          fill="none" stroke="url(#mGrad)" stroke-width="46"
          stroke-linecap="square" />
    <!-- Pointe de flèche -->
    <polygon points="280,16 232,74 260,74 260,84 300,84 300,74 328,74"
             fill="url(#mGrad)" />
  </g>

  <!-- IRAJ -->
  <text x="340" y="292"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="285" font-weight="500" fill="#7A8895" letter-spacing="-4">IRAJ</text>

  <!-- Recouvrement -->
  <text x="48" y="440"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="124" font-weight="700" fill="#7A8895" letter-spacing="0">Recouvrement</text>

  <!-- Premier filet horizontal -->
  <line x1="48" y1="480" x2="1032" y2="480" stroke="#7A8895" stroke-width="4" stroke-linecap="round" />

  <!-- Baseline Gardons un temps d'avance -->
  <text x="48" y="560"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="76" font-weight="600" font-style="italic" fill="#F5A623" letter-spacing="0.5">Gardons un temps d'avance</text>

  <!-- Second filet horizontal -->
  <line x1="48" y1="602" x2="1032" y2="602" stroke="#7A8895" stroke-width="4" stroke-linecap="round" />
</svg>